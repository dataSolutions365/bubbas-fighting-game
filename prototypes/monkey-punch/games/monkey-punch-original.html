<title>Monkey Punch Original</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: arcade cabinet. Hand-drawn opponent fills the canvas, four thumb buttons below. Single dark arena look by choice. */
:root {
  --night: #0d1220;
  --panel: #161d31;
  --edge: #2b3555;
  --glove: #ff4d3d;
  --gold: #ffd23f;
  --ink: #f3ead8;
  --muted: #9aa3bd;
  --display: "Bungee", Impact, "Arial Black", sans-serif;
  --body: "Rubik", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 10px; overflow-x: hidden;
}
header { display: flex; align-items: baseline; justify-content: space-between; width: 100%; max-width: 420px; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.3rem; margin: 0; color: var(--gold); text-wrap: balance; }
header p { margin: 0; font-size: .8rem; color: var(--muted); }
#game {
  width: min(100%, 420px, calc((100dvh - 190px) * 0.625));
  aspect-ratio: 400 / 640; max-width: 100%;
  border-radius: 14px; overflow: hidden; background: var(--panel);
  box-shadow: 0 0 0 3px #232c46, 0 18px 40px rgba(0,0,0,.45);
}
#game canvas { display: block; }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 420px; }
.pad button {
  font-family: var(--display); font-size: .82rem; color: var(--ink); background: var(--panel);
  border: 2px solid var(--edge); border-radius: 12px; padding: 14px 4px;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer;
}
.pad button.punch { background: #3a1a1d; border-color: var(--glove); color: #ffd9d2; }
.pad button:active { transform: scale(.95); filter: brightness(1.3); }
.pad button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.hint { font-size: .78rem; color: var(--muted); margin: 0; text-align: center; max-width: 420px; line-height: 1.45; }
kbd { font-family: var(--body); font-size: .72rem; background: var(--panel); border: 1px solid var(--edge); border-radius: 4px; padding: 1px 5px; color: var(--ink); }
</style>

<header>
  <h1>Monkey Punch</h1>
  <p>Original drawing edition</p>
</header>

<div id="game" aria-label="Boxing game using the hand-drawn monkey"></div>

<div class="pad">
  <button id="b-dl" data-act="dodgeL">◀ Dodge</button>
  <button id="b-pl" data-act="punchL" class="punch">Jab L</button>
  <button id="b-pr" data-act="punchR" class="punch">Jab R</button>
  <button id="b-dr" data-act="dodgeR">Dodge ▶</button>
</div>
<p class="hint">When an arm glows yellow he's about to swing it, so dodge. He'll throw his gloves up to block, so time your jabs. Hit him while he's dizzy. Keys: <kbd>←</kbd><kbd>→</kbd> dodge, <kbd>A</kbd><kbd>S</kbd> punch.</p>

function local(px, py) { return { x: (px - ART.ox * ART.W) * ART.k, y: (py - ART.oy * ART.H) * ART.k }; }
function starPts(x, y, r1, r2, n = 5) {
  const p = [];
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / n; p.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r }); }
  return p;
}
function makeGlove(scene, side) {
  const c = scene.add.container(0, 0), g = scene.add.graphics();
  g.fillStyle(0x8a5a34, 1); g.fillRoundedRect(-26, 30, 52, 70, 18); g.lineStyle(5, INK, 1); g.strokeRoundedRect(-26, 30, 52, 70, 18);
  g.fillStyle(WHITE, 1); g.fillRoundedRect(-34, 22, 68, 24, 8); g.lineStyle(5, INK, 1); g.strokeRoundedRect(-34, 22, 68, 24, 8);
  g.fillStyle(RED, 1); g.fillEllipse(side * 30, -4, 30, 44); g.lineStyle(5, INK, 1); g.strokeEllipse(side * 30, -4, 30, 44);
  g.fillStyle(RED, 1); g.fillCircle(0, -12, 44); g.lineStyle(5, INK, 1); g.strokeCircle(0, -12, 44);
  g.fillStyle(WHITE, .45); g.fillEllipse(-12, -32, 26, 13);
  c.add(g);

}

    const go = this.popup(200, 280, 'FIGHT!', '64px');
    go.setScale(.3); this.tweens.add({ targets: go, scale: 1, duration: 300, ease: 'Back.easeOut' });
    this.time.delayedCall(1000, () => { this.started = true; o.nextAt = this.time.now + 700; });
  }

  // Move every part to a named pose.
  pose(name, ms = 120, ease = 'Quad.easeOut') {
    const o = this.opp, P = POSES[name]; o.pose = name;
    const tw = (t, props) => { this.tweens.killTweensOf(t); this.tweens.add({ targets: t, ...props, duration: ms, ease }); };
    tw([o.armR, o.glowR], { angle: P.R[0], scale: P.R[1] });
    tw([o.armL, o.glowL], { angle: P.L[0], scale: P.L[1] });
    tw(o.head, { angle: P.head[0], x: o.head.base.x + P.head[1], y: o.head.base.y + P.head[2] });
    tw(o.body, { angle: P.body[0], scaleX: P.body[1], scaleY: P.body[2] });
    // High guard: the arms fold toward the camera, so we see the gloves come up in front of the face.
    const up = !!P.guard, fast = Math.min(ms, 70);
    [o.armL, o.armR].forEach(a => this.tweens.add({ targets: a, alpha: up ? 0 : 1, duration: fast }));
    [o.gloveL, o.gloveR].forEach((g, i) => {
      this.tweens.killTweensOf(g);
      const to = up ? g.face : g.rest;
      this.tweens.add({ targets: g, x: to.x, y: to.y, scale: up ? 1.35 : 1, angle: up ? (i ? 8 : -8) : 0, alpha: up ? 1 : 0, duration: ms, ease: 'Back.easeOut' });
    });
  }
  glow(side, on) {
    const g = side === 'R' ? this.opp.glowR : this.opp.glowL;
    this.tweens.killTweensOf(g, ['alpha']);
    g.alpha = 0;
    if (on) this.tweens.add({ targets: g, alpha: .95, duration: 110, yoyo: true, repeat: -1 });
  }
  flash() {
    const o = this.opp;
    o.parts.forEach(p => p.setTintFill(WHITE));
    this.time.delayedCall(60, () => o.parts.forEach(p => p.clearTint()));
  }

  drawArena() {
    const g = this.add.graphics();
    g.fillGradientStyle(0x070a14, 0x070a14, 0x1a2140, 0x1a2140, 1); g.fillRect(-100, 0, 600, 330);
    const crowd = [0x2a3156, 0x33294d, 0x24344a, 0x3b2f3a];
    for (let row = 0; row < 7; row++) for (let i = 0; i < 22; i++) {
      const x = -80 + i * 27 + (row % 2) * 13 + Phaser.Math.Between(-3, 3), y = 60 + row * 30;
      g.fillStyle(Phaser.Utils.Array.GetRandom(crowd), 1); g.fillCircle(x, y, 10); g.fillEllipse(x, y + 18, 26, 20);
    }
    for (let i = 0; i < 18; i++) { g.fillStyle(WHITE, Phaser.Math.FloatBetween(.15, .5)); g.fillCircle(Phaser.Math.Between(-60, 460), Phaser.Math.Between(60, 250), 2); }
    g.fillStyle(0xd7dbe6, 1); g.fillPoints([{ x: 20, y: 320 }, { x: 380, y: 320 }, { x: 520, y: 640 }, { x: -120, y: 640 }], true);
    g.lineStyle(3, 0xaab1c4, 1); g.strokeEllipse(200, 520, 260, 80);
    g.fillStyle(WHITE, .07); g.fillEllipse(200, 330, 340, 560);
    [[0xe23b3b, 258], [WHITE, 282], [0x3b6fe2, 306]].forEach(([c, y]) => {
      g.lineStyle(5, c, 1); g.lineBetween(20, y, 380, y);
      g.lineBetween(20, y, -110, y + 340); g.lineBetween(380, y, 510, y + 340);
    });
    g.fillStyle(0xc9ccd6, 1); g.fillRect(14, 244, 12, 84); g.fillRect(374, 244, 12, 84);
    g.lineStyle(3, INK, 1); g.strokeRect(14, 244, 12, 84); g.strokeRect(374, 244, 12, 84);
    g.fillStyle(0x000000, .28); g.fillEllipse(205, OPP_Y, 190, 30);
    return g;
  }

  drawHud() {
    const g = this.hud; g.clear();
    const bar = (x, pct, flip) => {
      g.fillStyle(0x000000, .55); g.fillRoundedRect(x, 32, 160, 14, 5);
      const c = pct > .5 ? 0x3ddc84 : pct > .25 ? GOLD : 0xff4d3d, w = 156 * Math.max(0, pct);
      g.fillStyle(c, 1); g.fillRoundedRect(flip ? x + 2 + 156 - w : x + 2, 34, Math.max(w, .01), 10, 4);
    };
    bar(16, this.pl.hp / 100, false); bar(224, this.opp.hp / 100, true);
  }
  popup(x, y, str, size = '32px', color = '#ffd23f') {
    const t = this.add.text(x, y, str, { fontFamily: FONT, fontSize: size, color, stroke: '#1b1110', strokeThickness: 7 }).setOrigin(.5).setDepth(120);
    this.tweens.add({ targets: t, y: y - 46, alpha: 0, delay: 350, duration: 550, onComplete: () => t.destroy() });
    return t;
  }
  spark(x, y) {
    const g = this.add.graphics({ x, y }).setDepth(110), pts = starPts(0, 0, 36, 15, 8);
    g.fillStyle(GOLD, 1); g.fillPoints(pts, true); g.lineStyle(4, INK, 1); g.strokePoints(pts, true);
    g.fillStyle(WHITE, 1); g.fillCircle(0, 0, 9); g.setScale(.4);
    this.tweens.add({ targets: g, scale: 1.25, alpha: 0, angle: 25, duration: 260, onComplete: () => g.destroy() });
  }

  act(a) {
    if (this.koReady) { this.scene.restart(); return; }
    if (!this.started || this.ko) return;
    if (a === 'dodgeL') this.dodge(-1); else if (a === 'dodgeR') this.dodge(1);
    else if (a === 'punchL') this.punch(0); else if (a === 'punchR') this.punch(1);
  }

  // ---------- player ----------
  dodge(dir) {
    const p = this.pl; if (p.busy) return;
    p.busy = true; p.dodging = true;
    this.tweens.add({ targets: this.world, x: -dir * 95, duration: 130, ease: 'Quad.easeOut' });
    p.gloves.forEach((g, i) => this.tweens.add({ targets: g, x: p.guard[i].x + dir * 40, angle: dir * 12, duration: 130 }));
    this.time.delayedCall(460, () => {
      p.dodging = false;
      this.tweens.add({ targets: this.world, x: 0, duration: 160, ease: 'Quad.easeInOut', onComplete: () => p.busy = false });
      p.gloves.forEach((g, i) => this.tweens.add({ targets: g, x: p.guard[i].x, angle: 0, duration: 160 }));
    });
  }

  punch(i) {
    const p = this.pl; if (p.busy) return;
    p.busy = true;
    const gl = p.gloves[i];
    this.tweens.killTweensOf(gl);
    this.tweens.add({
      targets: gl, x: i ? 225 : 175, y: 230, scale: .5, duration: 90, ease: 'Quad.easeIn',
      onComplete: () => {
        this.landPunch(i ? 1 : -1);
        this.tweens.add({ targets: gl, x: p.guard[i].x, y: p.guard[i].y, scale: 1, duration: 130, onComplete: () => p.busy = false });
      }
    });
  }

  landPunch(side) {
    const o = this.opp;
    if (o.state === 'block') { this.blocked(side); return; }
    if (o.state === 'idle') {
      if (Math.random() < .45) { this.startBlock(); this.blocked(side); }
      else this.hitOpp(4, side);
    } else if (o.state === 'windup') this.hitOpp(6, side);
    else if (o.state === 'tired') { this.hitOpp(10, side); this.popup(200 + side * 40, 150, 'POW!'); }
  }

  startBlock(ms = 520) {
    const o = this.opp; o.state = 'block';
    this.pose('block', 90);
    this.time.delayedCall(ms, () => {
      if (o.state !== 'block' || this.ko) return;
      o.state = 'idle'; this.pose('rest', 160);
      o.nextAt = this.time.now + Phaser.Math.Between(250, 700);
    });
  }

  blocked(side) {
    const o = this.opp;
    this.popup(200, 150, 'BLOCK', '22px', '#cfd6ea');
    this.tweens.add({ targets: o.c, x: OPP_X - side * 6, duration: 50, yoyo: true });
    this.tweens.add({ targets: [o.gloveL, o.gloveR], y: '+=10', duration: 50, yoyo: true });
  }

  hitOpp(dmg, side) {
    const o = this.opp;
    o.hp = Math.max(0, o.hp - dmg); this.drawHud();
    this.spark(200 + side * 22, 175);
    this.flash();
    // Head snaps away from the punch, body rocks, arms flail.
    const h = o.head;
    this.tweens.killTweensOf(h);
    this.tweens.add({ targets: h, angle: side * 22, x: h.base.x + side * 9, y: h.base.y + 3, duration: 70, yoyo: true, hold: 60, ease: 'Quad.easeOut' });
    this.tweens.add({ targets: o.body, angle: side * 5, duration: 80, yoyo: true, hold: 40 });
    this.tweens.add({ targets: [o.armR, o.glowR], angle: side * 14 + (o.armR.angle || 0), duration: 80, yoyo: true });
    this.tweens.add({ targets: [o.armL, o.glowL], angle: side * 14 + (o.armL.angle || 0), duration: 80, yoyo: true });
    this.tweens.add({ targets: o.c, x: OPP_X + side * 10, scale: OPP_S * .97, duration: 90, yoyo: true });
    if (o.hp <= 0) this.oppKO();
  }

  playerHit(dmg) {
    const p = this.pl;
    p.hp = Math.max(0, p.hp - dmg); this.drawHud();
    this.cameras.main.shake(200, .014); this.cameras.main.flash(140, 255, 70, 60);
    this.spark(200, 380);
    p.gloves.forEach(g => this.tweens.add({ targets: g, y: g.y + 30, duration: 90, yoyo: true }));
    this.popup(200, 430, 'OOF!', '30px', '#ff8a7a');
    if (p.hp <= 0) this.playerKO();
  }

  // ---------- opponent AI ----------
  startWindup() {
    const o = this.opp; o.state = 'windup';
    o.side = Math.random() < .5 ? 'R' : 'L';
    this.pose('wind' + o.side, 200);
    this.glow(o.side, true);
    const wait = Math.max(360, 720 - (100 - o.hp) * 3.2);
    this.time.delayedCall(wait, () => { if (o.state === 'windup' && !this.ko) this.throwPunch(); });
  }

  throwPunch() {
    const o = this.opp; o.state = 'punch';
    this.glow(o.side, false);
    this.pose('punch' + o.side, 120, 'Quad.easeIn');
    this.tweens.add({ targets: o.c, y: OPP_Y + 14, duration: 120, yoyo: true });
    this.time.delayedCall(125, () => this.resolvePunch());
  }

  resolvePunch() {
    if (this.ko) return;
    const o = this.opp;
    if (this.pl.dodging) {
      this.popup(200, 330, 'DODGED!', '30px', '#7fe3ff');
      o.state = 'tired';
      this.time.delayedCall(140, () => {
        this.pose('tired', 260);
        o.dizzy.visible = true;
        this.tweens.add({ targets: o.head, angle: { from: -10, to: 10 }, delay: 260, duration: 280, yoyo: true, repeat: -1 });
      });
      this.time.delayedCall(1450, () => this.recover());
    } else {
      this.playerHit(15);
      this.time.delayedCall(110, () => this.pose('rest', 220));
      o.state = 'idle'; o.nextAt = this.time.now + Phaser.Math.Between(900, 1700);
    }
  }

  recover() {
    const o = this.opp; if (o.state !== 'tired') return;
    o.dizzy.visible = false;
    this.pose('rest', 180);
    o.state = 'idle'; o.nextAt = this.time.now + Phaser.Math.Between(600, 1200);
  }

  oppKO() {
    const o = this.opp; o.state = 'ko'; this.ko = true; o.dizzy.visible = true;
    this.glow('R', false); this.glow('L', false);
    this.time.delayedCall(180, () => this.pose('ko', 300));
    this.tweens.add({ targets: o.c, angle: -80, y: OPP_Y - 40, delay: 150, duration: 750, ease: 'Bounce.easeOut' });
    this.endBanner('K.O.!', 'You win! Tap to fight again');
  }
  playerKO() {
    this.ko = true; this.opp.state = 'ko';
    this.pl.gloves.forEach(g => this.tweens.add({ targets: g, y: 900, duration: 600, ease: 'Quad.easeIn' }));
    this.pose('block', 200);
    this.time.delayedCall(220, () => this.tweens.add({ targets: this.opp.c, y: OPP_Y - 30, duration: 220, yoyo: true, repeat: 4 }));
    this.endBanner('DOWN!', 'The monkey wins. Tap to try again');
  }
  endBanner(big, small) {
    const t = this.add.text(200, 250, big, { fontFamily: FONT, fontSize: '76px', color: '#ffd23f', stroke: '#1b1110', strokeThickness: 10 }).setOrigin(.5).setDepth(130).setScale(.2);
    this.tweens.add({ targets: t, scale: 1, duration: 420, ease: 'Back.easeOut' });
    const s = this.add.text(200, 320, small, { fontFamily: FONT, fontSize: '15px', color: '#f3ead8', stroke: '#1b1110', strokeThickness: 5 }).setOrigin(.5).setDepth(130).setAlpha(0);
    this.time.delayedCall(900, () => { s.setAlpha(1); this.koReady = true; });
  }

  update(time) {
    const o = this.opp;
    if (o.state === 'idle' && o.pose === 'rest') {
      o.c.y = OPP_Y + Math.sin(time / 240) * 3;
      const sw = Math.sin(time / 300);
      if (!this.tweens.isTweening(o.armR)) { o.armR.angle = o.glowR.angle = sw * 4; o.armL.angle = o.glowL.angle = -sw * 4; }
      if (!this.tweens.isTweening(o.head)) o.head.angle = Math.sin(time / 420) * 2.5;
    }
    if (this.started && !this.ko && o.state === 'idle' && time > o.nextAt) {
      if (Math.random() < .2) { this.startBlock(600); }
      else this.startWindup();
    }
  }
}

function boot() {
  window.GAME = new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', width: 400, height: 640, backgroundColor: '#0d1220',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: Ring
  });
}
const fontReady = document.fonts && document.fonts.load ? document.fonts.load('32px Bungee') : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(boot, boot);
document.querySelectorAll('.pad button').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); window.MP && window.MP.act(b.dataset.act); });
});

</script>
