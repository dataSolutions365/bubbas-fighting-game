<title>Monkey Punch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: one-screen arcade cabinet. Game canvas on top, four big thumb buttons below. Single dark arena look by choice. */
:root {
  --night: #0d1220;
  --panel: #161d31;
  --rope: #e23b3b;
  --glove: #ff4d3d;
  --gold: #ffd23f;
  --ink: #f3ead8;
  --muted: #9aa3bd;
  --display: "Bungee", Impact, "Arial Black", sans-serif;
  --body: "Rubik", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  overflow-x: hidden;
}
header { display: flex; align-items: baseline; justify-content: space-between; width: 100%; max-width: 420px; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.35rem; margin: 0; color: var(--gold); letter-spacing: .02em; text-wrap: balance; }
header p { margin: 0; font-size: .8rem; color: var(--muted); }
#game {
  width: min(100%, 420px, calc((100dvh - 190px) * 0.625));
  aspect-ratio: 400 / 640;
  max-width: 100%;
  border-radius: 14px;
  overflow: hidden;
  background: var(--panel);
  box-shadow: 0 0 0 3px #232c46, 0 18px 40px rgba(0,0,0,.45);
}
#game canvas { display: block; }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 420px; }
.pad button {
  font-family: var(--display); font-size: .82rem; color: var(--ink);
  background: var(--panel); border: 2px solid #2b3555; border-radius: 12px;
  padding: 14px 4px; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  cursor: pointer; transition: transform .06s, background .1s;
}
.pad button.punch { background: #3a1a1d; border-color: var(--glove); color: #ffd9d2; }
.pad button:active { transform: scale(.95); background: #222b45; }
.pad button.punch:active { background: #5a2226; }
.pad button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.hint { font-size: .78rem; color: var(--muted); margin: 0; text-align: center; max-width: 420px; line-height: 1.45; }
kbd { font-family: var(--body); font-size: .72rem; background: var(--panel); border: 1px solid #2b3555; border-radius: 4px; padding: 1px 5px; color: var(--ink); }
</style>

<header>
  <h1>Monkey Punch</h1>
  <p>2.5D test build</p>
</header>

<div id="game" aria-label="Boxing game"></div>

<div class="pad">
  <button id="b-dl" data-act="dodgeL">◀ Dodge</button>
  <button id="b-pl" data-act="punchL" class="punch">Jab L</button>
  <button id="b-pr" data-act="punchR" class="punch">Jab R</button>
  <button id="b-dr" data-act="dodgeR">Dodge ▶</button>
</div>
<p class="hint">Watch for the glowing glove, then dodge. Hit him while he's dizzy for big damage. Keys: <kbd>←</kbd><kbd>→</kbd> dodge, <kbd>A</kbd><kbd>S</kbd> punch.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
const INK = 0x1b1110, FUR = 0x7a4a2a, FUR_DARK = 0x5e3820, TAN = 0xe9c9a0;
const RED = 0xff4d3d, WHITE = 0xffffff, GOLD = 0xffd23f;
const FONT = 'Bungee, Impact, "Arial Black", sans-serif';

function blob(g, x, y, w, h, fill, lw = 4) {
  g.fillStyle(fill, 1); g.fillEllipse(x, y, w, h);
  g.lineStyle(lw, INK, 1); g.strokeEllipse(x, y, w, h);
}
function starPts(x, y, r1, r2, n = 5) {
  const p = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = -Math.PI / 2 + i * Math.PI / n;
    p.push(new Phaser.Math.Vector2(x + Math.cos(a) * r, y + Math.sin(a) * r));
  }
  return p;
}
function tail(scene, pts, thick = 11) {
  const g = scene.add.graphics();
  const c = new Phaser.Curves.CubicBezier(...pts.map(p => new Phaser.Math.Vector2(p[0], p[1])));
  g.lineStyle(thick + 7, INK, 1); c.draw(g, 40);
  g.lineStyle(thick, FUR, 1); c.draw(g, 40);
  const e = pts[3]; g.fillStyle(FUR, 1); g.fillCircle(e[0], e[1], thick / 2);
  return g;
}
function makeGlove(scene, side, trim) {
  const c = scene.add.container(0, 0);
  const ring = scene.add.graphics();
  ring.fillStyle(GOLD, .35); ring.fillCircle(0, 0, 40);
  ring.lineStyle(6, GOLD, 1); ring.strokeCircle(0, 0, 36);
  ring.alpha = 0;
  const g = scene.add.graphics();
  blob(g, side * 15, -2, 16, 24, RED);
  g.fillStyle(RED, 1); g.fillCircle(0, 0, 25);
  g.lineStyle(4, INK, 1); g.strokeCircle(0, 0, 25);
  g.fillStyle(trim, 1); g.fillRoundedRect(-15, 17, 30, 12, 4);
  g.lineStyle(3, INK, 1); g.strokeRoundedRect(-15, 17, 30, 12, 4);
  g.fillStyle(WHITE, .5); g.fillEllipse(-7, -11, 13, 7);
  c.add([ring, g]); c.ring = ring;
  return c;
}

// The monkey from the drawing, facing the player.
function makeOpponent(scene, x, y, s) {
  const body = scene.add.container(x, y).setScale(s);
  body.add(tail(scene, [[-30, 45], [-95, 55], [-105, -20], [-70, -30]]));
  const legs = scene.add.graphics();
  blob(legs, -24, 90, 36, 64, FUR); blob(legs, 24, 90, 36, 64, FUR);
  blob(legs, -29, 124, 46, 20, TAN); blob(legs, 29, 124, 46, 20, TAN);
  const torso = scene.add.graphics();
  blob(torso, 0, 0, 98, 126, FUR);
  torso.fillStyle(TAN, 1); torso.fillEllipse(0, 10, 58, 84);
  torso.fillStyle(0x6b3fd1, 1); torso.fillRoundedRect(-47, 38, 94, 34, 12);
  torso.lineStyle(4, INK, 1); torso.strokeRoundedRect(-47, 38, 94, 34, 12);
  torso.fillStyle(WHITE, 1); torso.fillRect(-45, 40, 90, 7);
  body.add([legs, torso]);

  const head = scene.add.container(0, -100);
  const h = scene.add.graphics();
  h.fillStyle(FUR, 1); h.lineStyle(4, INK, 1);
  h.fillTriangle(-10, -40, 0, -66, 7, -40); h.strokeTriangle(-10, -40, 0, -66, 7, -40);
  h.fillTriangle(0, -40, 15, -60, 16, -38); h.strokeTriangle(0, -40, 15, -60, 16, -38);
  for (const sd of [-1, 1]) { blob(h, sd * 45, 2, 30, 30, FUR); h.fillStyle(TAN, 1); h.fillCircle(sd * 45, 2, 8); }
  blob(h, 0, 0, 94, 94, FUR);
  h.lineStyle(4, INK, 1);
  h.strokeEllipse(-15, -4, 38, 44); h.strokeEllipse(15, -4, 38, 44); h.strokeEllipse(0, 22, 62, 36);
  h.fillStyle(TAN, 1);
  h.fillEllipse(-15, -4, 38, 44); h.fillEllipse(15, -4, 38, 44); h.fillEllipse(0, 22, 62, 36);
  for (const sd of [-1, 1]) {
    h.fillStyle(WHITE, 1); h.fillEllipse(sd * 14, -4, 15, 17);
    h.lineStyle(3, INK, 1); h.strokeEllipse(sd * 14, -4, 15, 17);
    h.fillStyle(INK, 1); h.fillCircle(sd * 11, -2, 4.5);
  }
  h.lineStyle(6, INK, 1);
  h.lineBetween(-29, -21, -6, -12); h.lineBetween(29, -21, 6, -12);
  h.fillStyle(INK, 1); h.fillCircle(-5, 15, 2.5); h.fillCircle(5, 15, 2.5);
  h.lineStyle(4, INK, 1); h.beginPath(); h.arc(0, 37, 11, Math.PI * 1.15, Math.PI * 1.85); h.strokePath();
  head.add(h);
  body.add(head);

  const dizzy = scene.add.container(0, -168);
  const dz = scene.add.graphics();
  for (let i = 0; i < 3; i++) {
    const a = i * Math.PI * 2 / 3;
    dz.fillStyle(GOLD, 1); dz.fillPoints(starPts(Math.cos(a) * 40, Math.sin(a) * 12, 11, 5), true);
    dz.lineStyle(3, INK, 1); dz.strokePoints(starPts(Math.cos(a) * 40, Math.sin(a) * 12, 11, 5), true);
  }
  dizzy.add(dz); dizzy.visible = false;

  const arms = scene.add.graphics();
  const gloves = [makeGlove(scene, 1, WHITE), makeGlove(scene, -1, WHITE)];
  body.add([arms, ...gloves, dizzy]);
  const guard = [{ x: -36, y: -78 }, { x: 36, y: -78 }];
  gloves.forEach((g, i) => g.setPosition(guard[i].x, guard[i].y));
  return { body, head, dizzy, arms, gloves, guard, shoulders: [{ x: -46, y: -40 }, { x: 46, y: -40 }], baseY: y };
}

// The player: same monkey seen from behind, see-through so you can watch the opponent.
function makePlayer(scene, x, y, s) {
  const body = scene.add.container(x, y).setScale(s).setAlpha(.82);
  const legs = scene.add.graphics();
  blob(legs, -24, 90, 38, 64, FUR); blob(legs, 24, 90, 38, 64, FUR);
  const torso = scene.add.graphics();
  blob(torso, 0, 0, 104, 128, FUR);
  torso.lineStyle(3, FUR_DARK, 1); torso.lineBetween(0, -50, 0, 30);
  torso.fillStyle(0x1f9e6a, 1); torso.fillRoundedRect(-50, 38, 100, 36, 12);
  torso.lineStyle(4, INK, 1); torso.strokeRoundedRect(-50, 38, 100, 36, 12);
  torso.fillStyle(WHITE, 1); torso.fillRect(-48, 40, 96, 7);
  body.add([legs, torso, tail(scene, [[8, 50], [60, 70], [85, 10], [62, -20]])]);
  const head = scene.add.container(0, -102);
  const h = scene.add.graphics();
  h.fillStyle(FUR, 1); h.lineStyle(4, INK, 1);
  h.fillTriangle(-10, -40, 0, -66, 7, -40); h.strokeTriangle(-10, -40, 0, -66, 7, -40);
  h.fillTriangle(0, -40, 15, -60, 16, -38); h.strokeTriangle(0, -40, 15, -60, 16, -38);
  for (const sd of [-1, 1]) blob(h, sd * 46, 4, 30, 30, FUR);
  blob(h, 0, 0, 96, 96, FUR);
  h.fillStyle(FUR_DARK, .6); h.fillEllipse(0, 14, 50, 30);
  head.add(h); body.add(head);
  const arms = scene.add.graphics();
  const gloves = [makeGlove(scene, -1, 0xbff5dc), makeGlove(scene, 1, 0xbff5dc)];
  body.add([arms, ...gloves]);
  const guard = [{ x: -40, y: -96 }, { x: 40, y: -96 }];
  gloves.forEach((g, i) => g.setPosition(guard[i].x, guard[i].y));
  return { body, head, arms, gloves, guard, shoulders: [{ x: -46, y: -48 }, { x: 46, y: -48 }], baseX: x, baseY: y };
}

function drawArms(f) {
  const g = f.arms; g.clear();
  for (let i = 0; i < 2; i++) {
    const s = f.shoulders[i], gl = f.gloves[i], w = 20 * Math.sqrt(gl.scale);
    g.lineStyle(w + 8, INK, 1); g.lineBetween(s.x, s.y, gl.x, gl.y);
    g.fillStyle(INK, 1); g.fillCircle(s.x, s.y, (w + 8) / 2);
    g.lineStyle(w, FUR, 1); g.lineBetween(s.x, s.y, gl.x, gl.y);
    g.fillStyle(FUR, 1); g.fillCircle(s.x, s.y, w / 2);
  }
}

class Ring extends Phaser.Scene {
  constructor() { super('ring'); }

  create() {
    window.MP = this;
    this.ko = false; this.started = false;
    this.drawArena();
    this.opp = makeOpponent(this, 200, 300, 1.45);
    Object.assign(this.opp, { state: 'idle', hp: 100, nextAt: 0 });
    this.pl = makePlayer(this, 200, 650, 1.8);
    Object.assign(this.pl, { hp: 100, busy: false, dodging: false });
    this.hud = this.add.graphics().setDepth(10);
    this.add.text(16, 12, 'YOU', { fontFamily: FONT, fontSize: '14px', color: '#f3ead8' }).setDepth(10);
    this.add.text(384, 12, 'MONKEY', { fontFamily: FONT, fontSize: '14px', color: '#f3ead8' }).setOrigin(1, 0).setDepth(10);
    this.drawHud();

    this.tweens.add({ targets: this.opp.dizzy, angle: 360, duration: 1400, repeat: -1 });
    this.input.keyboard.on('keydown', e => {
      const map = { ArrowLeft: 'dodgeL', ArrowRight: 'dodgeR', KeyA: 'punchL', KeyS: 'punchR', KeyZ: 'punchL', KeyX: 'punchR', Space: 'any' };
      if (map[e.code]) { e.preventDefault(); this.act(map[e.code]); }
    });
    this.input.on('pointerdown', () => { if (this.koReady) this.scene.restart(); });

    const go = this.popup(200, 300, 'FIGHT!', '64px', '#ffd23f');
    go.setScale(.3);
    this.tweens.add({ targets: go, scale: 1, duration: 300, ease: 'Back.easeOut' });
    this.time.delayedCall(1000, () => { this.started = true; this.opp.nextAt = this.time.now + 700; });
  }

  drawArena() {
    const g = this.add.graphics();
    g.fillGradientStyle(0x070a14, 0x070a14, 0x1a2140, 0x1a2140, 1); g.fillRect(0, 0, 400, 300);
    const crowd = [0x2a3156, 0x33294d, 0x24344a, 0x3b2f3a];
    for (let row = 0; row < 6; row++) for (let i = 0; i < 16; i++) {
      const x = i * 27 + (row % 2) * 13 + Phaser.Math.Between(-3, 3), y = 70 + row * 30;
      g.fillStyle(Phaser.Utils.Array.GetRandom(crowd), 1); g.fillCircle(x, y, 10); g.fillEllipse(x, y + 18, 26, 20);
    }
    for (let i = 0; i < 14; i++) { g.fillStyle(WHITE, Phaser.Math.FloatBetween(.15, .5)); g.fillCircle(Phaser.Math.Between(10, 390), Phaser.Math.Between(70, 230), 2); }
    g.fillStyle(0xd7dbe6, 1); g.fillPoints([{ x: 30, y: 292 }, { x: 370, y: 292 }, { x: 470, y: 640 }, { x: -70, y: 640 }], true);
    g.fillStyle(0xbfc5d4, 1); g.fillPoints([{ x: 30, y: 292 }, { x: 370, y: 292 }, { x: 372, y: 300 }, { x: 28, y: 300 }], true);
    g.lineStyle(3, 0xaab1c4, 1); g.strokeEllipse(200, 470, 240, 70);
    g.fillStyle(WHITE, .07); g.fillEllipse(200, 330, 330, 520);
    [[0xe23b3b, 232], [WHITE, 254], [0x3b6fe2, 276]].forEach(([c, y]) => {
      g.lineStyle(5, c, 1); g.lineBetween(30, y, 370, y);
      g.lineBetween(30, y, -60, y + 330); g.lineBetween(370, y, 460, y + 330);
    });
    g.fillStyle(0xc9ccd6, 1); g.fillRect(24, 218, 12, 82); g.fillRect(364, 218, 12, 82);
    g.lineStyle(3, INK, 1); g.strokeRect(24, 218, 12, 82); g.strokeRect(364, 218, 12, 82);
    g.fillStyle(0x000000, .28); g.fillEllipse(200, 484, 170, 28);
  }

  drawHud() {
    const g = this.hud; g.clear();
    const bar = (x, pct, flip) => {
      g.fillStyle(0x000000, .55); g.fillRoundedRect(x, 32, 160, 14, 5);
      const c = pct > .5 ? 0x3ddc84 : pct > .25 ? GOLD : 0xff4d3d, w = 156 * Math.max(0, pct);
      g.fillStyle(c, 1); g.fillRoundedRect(flip ? x + 2 + 156 - w : x + 2, 34, Math.max(w, .01), 10, 4);
    };
    bar(16, this.pl.hp / 100, false); bar(224, this.opp.hp / 100, true);
  }

  popup(x, y, str, size = '32px', color = '#ffd23f') {
    const t = this.add.text(x, y, str, { fontFamily: FONT, fontSize: size, color, stroke: '#1b1110', strokeThickness: 7 }).setOrigin(.5).setDepth(20);
    this.tweens.add({ targets: t, y: y - 46, alpha: 0, delay: 350, duration: 550, onComplete: () => t.destroy() });
    return t;
  }

  spark(x, y) {
    const g = this.add.graphics({ x, y }).setDepth(15);
    g.fillStyle(GOLD, 1); g.fillPoints(starPts(0, 0, 34, 14, 8), true);
    g.lineStyle(4, INK, 1); g.strokePoints(starPts(0, 0, 34, 14, 8), true);
    g.fillStyle(WHITE, 1); g.fillCircle(0, 0, 9);
    g.setScale(.4);
    this.tweens.add({ targets: g, scale: 1.25, alpha: 0, angle: 25, duration: 260, onComplete: () => g.destroy() });
  }

  act(a) {
    if (this.koReady) { this.scene.restart(); return; }
    if (!this.started || this.ko) return;
    if (a === 'dodgeL') this.dodge(-1);
    else if (a === 'dodgeR') this.dodge(1);
    else if (a === 'punchL') this.punch(0);
    else if (a === 'punchR') this.punch(1);
  }

  // ---------- player ----------
  dodge(dir) {
    const p = this.pl; if (p.busy) return;
    p.busy = true; p.dodging = true;
    this.tweens.add({
      targets: p.body, x: p.baseX + dir * 92, angle: dir * 14, duration: 130, ease: 'Quad.easeOut',
      onComplete: () => this.time.delayedCall(330, () => {
        p.dodging = false;
        this.tweens.add({ targets: p.body, x: p.baseX, angle: 0, duration: 160, ease: 'Quad.easeInOut', onComplete: () => p.busy = false });
      })
    });
  }

  punch(i) {
    const p = this.pl; if (p.busy) return;
    p.busy = true;
    const gl = p.gloves[i], side = i ? 1 : -1;
    this.tweens.killTweensOf(gl);
    this.tweens.add({ targets: p.head, x: side * -10, duration: 80, yoyo: true });
    this.tweens.add({
      targets: gl, x: side * 10, y: -228, scale: .62, duration: 85, ease: 'Quad.easeIn',
      onComplete: () => {
        this.landPunch(side);
        this.tweens.add({ targets: gl, x: p.guard[i].x, y: p.guard[i].y, scale: 1, duration: 120, onComplete: () => p.busy = false });
      }
    });
  }

  landPunch(side) {
    const o = this.opp;
    if (o.state === 'idle') {
      if (Math.random() < .55) {
        this.tweens.killTweensOf(o.gloves);
        o.gloves.forEach((g, i) => this.tweens.add({ targets: g, x: i ? 15 : -15, y: -86, duration: 60, yoyo: true, hold: 80 }));
        this.popup(200, 150, 'BLOCK', '22px', '#cfd6ea');
      } else this.hitOpp(4, side);
    } else if (o.state === 'windup') this.hitOpp(6, side);
    else if (o.state === 'tired') { this.hitOpp(10, side); this.popup(200 + side * 40, 140, 'POW!'); }
  }

  hitOpp(dmg, side) {
    const o = this.opp;
    o.hp = Math.max(0, o.hp - dmg); this.drawHud();
    this.spark(200 + side * 18, 190);
    this.tweens.add({ targets: o.head, x: -side * 12, angle: -side * 16, duration: 70, yoyo: true, ease: 'Quad.easeOut' });
    this.tweens.add({ targets: o.body, x: 200 - side * 6, duration: 70, yoyo: true });
    if (o.hp <= 0) this.oppKO();
  }

  playerHit(dmg) {
    const p = this.pl;
    p.hp = Math.max(0, p.hp - dmg); this.drawHud();
    this.cameras.main.shake(200, .014);
    this.cameras.main.flash(140, 255, 70, 60);
    this.spark(200, 380);
    this.tweens.add({ targets: p.body, y: p.baseY + 22, duration: 90, yoyo: true });
    this.popup(200, 420, 'OOF!', '30px', '#ff8a7a');
    if (p.hp <= 0) this.playerKO();
  }

  // ---------- opponent AI ----------
  startWindup() {
    const o = this.opp, i = Phaser.Math.Between(0, 1), gl = o.gloves[i], dir = i ? 1 : -1;
    o.state = 'windup';
    this.tweens.killTweensOf(gl);
    this.tweens.add({ targets: gl, x: dir * 62, y: -108, scale: .85, duration: 180, ease: 'Quad.easeOut' });
    this.tweens.add({ targets: o.head, angle: -dir * 7, duration: 180 });
    gl.ring.alpha = 0;
    this.tweens.add({ targets: gl.ring, alpha: 1, duration: 110, yoyo: true, repeat: -1 });
    const wait = Math.max(360, 720 - (100 - o.hp) * 3.2);
    this.time.delayedCall(wait, () => { if (o.state === 'windup' && !this.ko) this.throwPunch(i); });
  }

  throwPunch(i) {
    const o = this.opp, gl = o.gloves[i], dir = i ? 1 : -1;
    o.state = 'punch';
    this.tweens.killTweensOf(gl.ring); gl.ring.alpha = 0;
    this.tweens.add({ targets: o.head, angle: dir * 5, duration: 120 });
    this.tweens.add({
      targets: gl, x: dir * 8, y: 60, scale: 2.6, duration: 120, ease: 'Quad.easeIn',
      onComplete: () => this.resolvePunch(i)
    });
  }

  resolvePunch(i) {
    if (this.ko) return;
    const o = this.opp, gl = o.gloves[i];
    if (this.pl.dodging) {
      this.popup(200, 330, 'DODGED!', '30px', '#7fe3ff');
      o.state = 'tired';
      o.dizzy.visible = true;
      o.gloves.forEach((g, k) => { this.tweens.killTweensOf(g); this.tweens.add({ targets: g, x: k ? 46 : -46, y: -6, scale: 1, duration: 260, ease: 'Quad.easeOut' }); });
      this.tweens.add({ targets: o.head, angle: { from: -10, to: 10 }, duration: 260, yoyo: true, repeat: -1 });
      this.time.delayedCall(1350, () => this.recover());
    } else {
      this.playerHit(15);
      this.tweens.add({ targets: gl, x: o.guard[i].x, y: o.guard[i].y, scale: 1, duration: 220, ease: 'Quad.easeOut' });
      this.tweens.add({ targets: o.head, angle: 0, duration: 200 });
      o.state = 'idle'; o.nextAt = this.time.now + Phaser.Math.Between(800, 1700);
    }
  }

  recover() {
    const o = this.opp; if (o.state !== 'tired') return;
    o.dizzy.visible = false;
    this.tweens.killTweensOf(o.head);
    this.tweens.add({ targets: o.head, angle: 0, x: 0, duration: 160 });
    o.gloves.forEach((g, k) => this.tweens.add({ targets: g, x: o.guard[k].x, y: o.guard[k].y, duration: 220 }));
    o.state = 'idle'; o.nextAt = this.time.now + Phaser.Math.Between(600, 1200);
  }

  // ---------- endings ----------
  oppKO() {
    const o = this.opp;
    o.state = 'ko'; this.ko = true; o.dizzy.visible = true;
    this.tweens.killTweensOf([o.head, ...o.gloves]);
    this.tweens.add({ targets: o.body, angle: -84, y: o.baseY + 120, scale: 1.3, duration: 650, ease: 'Bounce.easeOut' });
    this.endBanner('K.O.!', 'You win! Tap to fight again');
  }

  playerKO() {
    this.ko = true; this.opp.state = 'ko';
    this.tweens.add({ targets: this.pl.body, y: 900, angle: 18, duration: 700, ease: 'Quad.easeIn' });
    this.tweens.add({ targets: this.opp.gloves, y: -150, duration: 300, yoyo: true, repeat: 3 });
    this.endBanner('DOWN!', 'The monkey wins. Tap to try again');
  }

  endBanner(big, small) {
    const t = this.add.text(200, 250, big, { fontFamily: FONT, fontSize: '76px', color: '#ffd23f', stroke: '#1b1110', strokeThickness: 10 }).setOrigin(.5).setDepth(30).setScale(.2);
    this.tweens.add({ targets: t, scale: 1, duration: 420, ease: 'Back.easeOut' });
    const s = this.add.text(200, 320, small, { fontFamily: FONT, fontSize: '15px', color: '#f3ead8', stroke: '#1b1110', strokeThickness: 5 }).setOrigin(.5).setDepth(30).setAlpha(0);
    this.time.delayedCall(900, () => { s.setAlpha(1); this.koReady = true; });
  }

  update(time) {
    const o = this.opp;
    if (o.state !== 'ko') {
      o.body.y = o.baseY + Math.sin(time / 240) * 4;
      if (o.state !== 'tired') o.body.angle = Math.sin(time / 480) * 1.5;
    }
    if (this.started && !this.ko && o.state === 'idle' && time > o.nextAt) this.startWindup();
    drawArms(o); drawArms(this.pl);
  }
}

function boot() {
  new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', width: 400, height: 640,
    backgroundColor: '#0d1220',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: Ring
  });
}
const fontReady = document.fonts && document.fonts.load ? document.fonts.load('32px Bungee') : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(boot, boot);

document.querySelectorAll('.pad button').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); window.MP && window.MP.act(b.dataset.act); });
});
</script>
